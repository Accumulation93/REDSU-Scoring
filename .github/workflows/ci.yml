name: quality-gates

on:
  push:
    branches: [feature/audit, main]
  pull_request:

permissions:
  contents: read

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SECURITY_TEST_DB_HOST: 127.0.0.1
      SECURITY_TEST_DB_PORT: 3306
      HR_IMPORT_TEST_DB_HOST: 127.0.0.1
      HR_IMPORT_TEST_DB_PORT: 3306
      TEST_DB_USER_HOST: '%'
      DEPLOY_TEST_DB_HOST: 127.0.0.1
      DEPLOY_TEST_DB_PORT: 3306
      DEPLOY_TEST_DB_USER: root
      DEPLOY_TEST_DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install locked dependencies
        working-directory: server
        run: npm ci
      - name: Syntax and static audits
        run: |
          git ls-files -z '*.js' | xargs -0 -n1 node --check
          node scripts/miniprogram-compat-audit.js
          node scripts/wechat-template-runtime-audit.js
          node scripts/org-lifecycle-audit.js --strict
          node scripts/security-audit.js --strict
          node scripts/secret-audit.js --strict
          node scripts/tenant-sql-audit.js
          node scripts/time-system-audit.js --strict
          node server/scripts/preflightUtcTimeMigration.js --schema server/db/init.sql --strict
          node scripts/admin-route-permission-audit.js --strict
          node scripts/ui-audit.js --strict
          node scripts/user-visible-copy-audit.js --strict
          node scripts/user-visible-copy-audit.js --localization-prefix=miniprogram/ --strict-localization
          node scripts/user-visible-copy-audit.js --localization-prefix=server/src/ --strict-localization
          node scripts/user-visible-copy-audit.js --strict-guidance
          git diff --check
      - name: Unit and integration tests
        run: |
          node scripts/org-session-test.js
          node scripts/auth-context-activation-test.js
          node scripts/auth-context-recovery-test.js
          node scripts/context-route-guard-test.js
          node scripts/workspace-hero-test.js
          node scripts/portal-back-logout-test.js
          node scripts/native-navigation-test.js
          node scripts/trusted-navigation-recovery-test.js
          node scripts/hr-profile-layout-test.js
          node scripts/hr-governance-integration-test.js
          node scripts/api-cancellation-test.js
          node scripts/api-auth-recovery-test.js
          node scripts/admin-activity-org-switch-test.js
          node scripts/notification-org-switch-role-test.js
          node scripts/publication-summary-refresh-test.js
          node scripts/login-binding-refresh-test.js
          node scripts/password-binding-offer-test.js
          node scripts/login-auth-continuation-test.js
          node scripts/hr-profile-export-test.js
          node scripts/personnel-picker-test.js
          node scripts/venue-rule-display-test.js
          node scripts/scoring-work-context-test.js
          node scripts/scoring-home-lifecycle-test.js
          node scripts/scoring-home-return-refresh-test.js
          node scripts/scoring-publication-activity-selection-test.js
          find miniprogram -type f -name '*.test.js' -print0 | sort -z | xargs -0 -n1 node
          for test_file in server/test/*.test.js; do node "$test_file"; done
          bash -n server/scripts/deployProduction.sh
          bash -n server/scripts/deployEntrypoint.sh
          bash -n server/scripts/setupCollabSession.sh
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw 'scripts/remote-collab.ps1')) | Out-Null"
      - name: Dependency audit
        working-directory: server
        run: npm audit

  deploy-production:
    name: deploy-production
    needs: audit-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: whusu-smart-workspace-production
      cancel-in-progress: false
    steps:
      - name: Configure pinned production SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_KEY" > "$HOME/.ssh/whusu-smart-workspace-production"
          chmod 600 "$HOME/.ssh/whusu-smart-workspace-production"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deploy exact successful commit
        timeout-minutes: 45
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          ssh -i "$HOME/.ssh/whusu-smart-workspace-production" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$PROD_USER@$PROD_HOST" \
            "env WHUSU_SMART_WORKSPACE_DEPLOY_BRANCH=main /home/ubuntu/whusu-smart-workspace-deploy/bin/deploy-entrypoint $TARGET_SHA"
